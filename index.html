<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style type="text/css"></style>
</head>

<body>

    <div class="container py-4">
        <div class="row">
            <div class="col-12 mb-5">
                <label for="getArtStyle">Art Style</label>
                <select id="getArtStyle" name="getArtStyle"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getAge">Age</label>
                <select id="getAge" name="getAge"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getGender">Gender</label>
                <select id="getGender" name="getGender"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getNationality">Nationality</label>
                <select id="getNationality" name="getNationality"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getHaircolor">Haircolor</label>
                <select id="getHaircolor" name="getHaircolor"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getHairstyle">Hairstyle</label>
                <select id="getHairstyle" name="getHairstyle"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getHeight">Height</label>
                <select id="getHeight" name="getHeight"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getOverallBuild">Overall Build</label>
                <select id="getOverallBuild" name="getOverallBuild"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getSpecificBody">Specific Body Options</label>
                <select id="getSpecificBody" name="getSpecificBody"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getOutfit">Outfit</label>
                <select id="getOutfit" name="getOutfit"></select>
            </div>
            <div class="col-12 mb-5">
                <label for="getAction">Action</label>
                <select id="getAction" name="getAction"></select>
            </div>
            <div class="col-12 mb-5">
                <button class="btn btn-primary" onclick="generateBatch()">
                    Generate
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-12 alert alert-info">
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script src="presets.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</html>
